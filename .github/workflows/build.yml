name: Build Unsigned iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Project Files and AppIcon
        run: |
          echo "" | base64 --decode > fallback_project.zip
          unzip -o fallback_project.zip
          rm -f fallback_project.zip
          mkdir -p iMhmadMusic
          for f in *.swift; do
            if [ -f "$f" ]; then
              cp -f "$f" iMhmadMusic/
            fi
          done
          if [ -f "AppIcon.png" ]; then
            sips -s format png -z 1024 1024 "AppIcon.png" --out "iMhmadMusic/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          fi

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project iMhmadMusic.xcodeproj -scheme iMhmadMusic

      - name: Build Unsigned Release App
        run: |
          xcodebuild build \
            -project iMhmadMusic.xcodeproj \
            -scheme iMhmadMusic \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA Payload
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "iMhmadMusic.app" -type d | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r9 iMhmadMusic-Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iMhmadMusic-Unsigned-IPA
          path: iMhmadMusic-Unsigned.ipa
          retention-days: 30
